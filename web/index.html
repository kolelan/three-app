<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Прогулка по комнате</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="3D Room">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000000'/%3E%3Crect x='20' y='20' width='60' height='60' fill='%23ff00aa'/%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(5px);
            font-size: 14px;
            user-select: none;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-family: monospace;
            font-size: 16px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        @media (min-width: 768px) {
            #controls { left: auto; right: 20px; top: 20px; bottom: auto; width: auto; background: rgba(0,0,0,0.5); }
            #info { top: 20px; left: 20px; font-size: 16px; }
        }
        .instruction {
            position: absolute;
            bottom: 30%;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.5);
            padding: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
<div id="info">
    🎮 3D Исследователь
    <div style="font-size:12px; opacity:0.8;">Нажми на сцену для активации управления</div>
</div>
<div id="controls">
    🎮 УПРАВЛЕНИЕ: [W] Вперёд | [S] Назад | [A] Поворот влево | [D] Поворот вправо | [Пробел] Прыжок | [ЛКМ] Выстрел в точку под курсором
</div>

<!-- Подключаем Three.js из CDN (вместо локального файла) -->
<script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

<script type="module">
    import * as THREE from 'three';

    // --- 1. Инициализация сцены, камеры, рендерера ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111122); // Тёмный фон, как ночное небо

    // Камера: угол обзора 75°, соотношение сторон, ближняя/дальняя плоскость
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; // Включаем тени для красоты
    document.body.appendChild(renderer.domElement);

    // --- 2. Освещение ---
    // Ambient light - равномерный свет
    const ambientLight = new THREE.AmbientLight(0x404060);
    scene.add(ambientLight);

    // Точечный свет (как лампочка)
    const pointLight = new THREE.PointLight(0xffffff, 1);
    pointLight.position.set(2, 3, 4);
    scene.add(pointLight);

    // Добавим ещё один свет с другой стороны для мягкости
    const fillLight = new THREE.PointLight(0xcc99ff, 0.5);
    fillLight.position.set(-2, 1, 3);
    scene.add(fillLight);

    // Небольшой свет сзади для контражура
    const backLight = new THREE.PointLight(0xffaa66, 0.3);
    backLight.position.set(0, 2, -5);
    scene.add(backLight);

    // --- 3. Создание объектов ---

    // Пол (коричневый)
    const floor = new THREE.Mesh(
        new THREE.BoxGeometry(),
        new THREE.MeshStandardMaterial({ color: 0xad7600, roughness: 0.7, metalness: 0.1 })
    );
    floor.scale.set(5, 0.1, 10);
    floor.position.y = -0.5;
    floor.receiveShadow = true;
    scene.add(floor);

    // Стены (зелёные)
    // Задняя стена (Z = 5)
    const wallBack = new THREE.Mesh(
        new THREE.BoxGeometry(),
        new THREE.MeshStandardMaterial({ color: 0x2c5e2e, roughness: 0.4 })
    );
    wallBack.scale.set(5, 1, 0.1);
    wallBack.position.z = 5;
    wallBack.position.y = 0;
    wallBack.receiveShadow = true;
    scene.add(wallBack);

    // Передняя стена (Z = -5)
    const wallFront = new THREE.Mesh(
        new THREE.BoxGeometry(),
        new THREE.MeshStandardMaterial({ color: 0x2c5e2e, roughness: 0.4 })
    );
    wallFront.scale.set(5, 1, 0.1);
    wallFront.position.z = -5;
    wallFront.position.y = 0;
    wallFront.receiveShadow = true;
    scene.add(wallFront);

    // Левая стена (X = -2.5)
    const wallLeft = new THREE.Mesh(
        new THREE.BoxGeometry(),
        new THREE.MeshStandardMaterial({ color: 0x2c5e2e, roughness: 0.4 })
    );
    wallLeft.scale.set(0.1, 1, 10);
    wallLeft.position.x = -2.5;
    wallLeft.position.y = 0;
    wallLeft.receiveShadow = true;
    scene.add(wallLeft);

    // Правая стена (X = 2.5)
    const wallRight = new THREE.Mesh(
        new THREE.BoxGeometry(),
        new THREE.MeshStandardMaterial({ color: 0x2c5e2e, roughness: 0.4 })
    );
    wallRight.scale.set(0.1, 1, 10);
    wallRight.position.x = 2.5;
    wallRight.position.y = 0;
    wallRight.receiveShadow = true;
    scene.add(wallRight);

    // Потолок (сиреневый)
    const ceiling = new THREE.Mesh(
        new THREE.BoxGeometry(),
        new THREE.MeshStandardMaterial({ color: 0xaa88ff, roughness: 0.8, emissive: 0x221133 })
    );
    ceiling.scale.set(5, 0.1, 10);
    ceiling.position.y = 0.8;
    ceiling.receiveShadow = true;
    scene.add(ceiling);

    // --- Декоративные элементы: несколько кубов в комнате для ощущения объёма ---
    const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0xffaa44, metalness: 0.6, roughness: 0.2 });
    const cube1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), cubeMaterial);
    cube1.position.set(1, -0.25, 2);
    cube1.castShadow = true;
    scene.add(cube1);

    const cube2 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), cubeMaterial);
    cube2.position.set(-1.5, -0.2, -2);
    cube2.castShadow = true;
    scene.add(cube2);

    const sphereMat = new THREE.MeshStandardMaterial({ color: 0x66ccff, metalness: 0.8, roughness: 0.1 });
    const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), sphereMat);
    sphere.position.set(0.5, -0.1, -3);
    sphere.castShadow = true;
    scene.add(sphere);

    // Маленький куб на полу
    const smallCube = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0xdd5555, metalness: 0.3 }));
    smallCube.position.set(-0.8, -0.3, 3.2);
    smallCube.castShadow = true;
    scene.add(smallCube);

    const shootables = [cube1, cube2, sphere, smallCube];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const bulletGeometry = new THREE.SphereGeometry(0.06, 8, 8);
    const bulletMaterial = new THREE.MeshBasicMaterial({ color: 0xffff66 });
    const bullets = [];
    const BULLET_SPEED = 18;
    const FIRE_COOLDOWN = 0.25;
    let lastShotTime = 0;

    function setMouseNDC(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function syncCameraForRaycast() {
        camera.position.set(position.x, playerY, position.z);
        const lookAtX = position.x + Math.sin(rotate);
        const lookAtZ = position.z + Math.cos(rotate);
        camera.lookAt(lookAtX, playerY - 0.3, lookAtZ);
        camera.updateMatrixWorld();
    }

    function getShootDirectionFromMouse(event) {
        setMouseNDC(event);
        syncCameraForRaycast();
        raycaster.setFromCamera(mouse, camera);
        return raycaster.ray.direction.clone();
    }

    function onTargetHit(target) {
        if (!shootables.includes(target)) return;
        target.material = target.material.clone();
        target.material.emissive.setHex(0xff3333);
        target.scale.multiplyScalar(0.75);
        if (target.scale.x < 0.12) {
            scene.remove(target);
            const index = shootables.indexOf(target);
            if (index !== -1) shootables.splice(index, 1);
        }
    }

    function shoot(event) {
        const now = performance.now() / 1000;
        if (now - lastShotTime < FIRE_COOLDOWN) return;
        lastShotTime = now;

        const direction = getShootDirectionFromMouse(event);
        const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);
        bullet.position.set(position.x, playerY, position.z);
        bullet.userData.velocity = direction.clone().multiplyScalar(BULLET_SPEED);
        bullet.userData.life = 2;
        scene.add(bullet);
        bullets.push(bullet);
    }

    function updateBullets(delta) {
        for (let i = bullets.length - 1; i >= 0; i--) {
            const bullet = bullets[i];
            const velocity = bullet.userData.velocity;
            bullet.position.addScaledVector(velocity, delta);
            bullet.userData.life -= delta;

            raycaster.set(bullet.position, velocity.clone().normalize());
            const hits = raycaster.intersectObjects(shootables, false);
            if (hits.length > 0) {
                onTargetHit(hits[0].object);
                scene.remove(bullet);
                bullets.splice(i, 1);
                continue;
            }

            if (bullet.userData.life <= 0) {
                scene.remove(bullet);
                bullets.splice(i, 1);
            }
        }
    }

    renderer.domElement.addEventListener('mousedown', (event) => {
        if (event.button === 0) shoot(event);
    });

    // --- 4. Управление с клавиатуры (WASD) ---
    // Состояние клавиш
    const keys = { w: false, a: false, s: false, d: false };

    // Позиция и поворот камеры (в двухмерном пространстве X-Z, поворот по Y)
    // Инициализируем позицию в центре комнаты
    let position = { x: 0, z: 0 };
    let rotate = 0; // угол в радианах

    const GROUND_Y = 0.5;
    const GRAVITY = 14;
    const JUMP_VELOCITY = 3.2;
    let playerY = GROUND_Y;
    let velocityY = 0;
    let onGround = true;

    // Устанавливаем начальное положение камеры
    camera.position.x = position.x;
    camera.position.z = position.z;
    camera.position.y = playerY;

    // Обработчики событий клавиатуры
    function keyDown(event) {
        switch(event.code) {
            case 'KeyW': keys.w = true; break;
            case 'KeyA': keys.a = true; break;
            case 'KeyS': keys.s = true; break;
            case 'KeyD': keys.d = true; break;
            case 'Space':
                if (!event.repeat && onGround) {
                    velocityY = JUMP_VELOCITY;
                    onGround = false;
                }
                event.preventDefault();
                break;
            default: break;
        }
    }

    function keyUp(event) {
        switch(event.code) {
            case 'KeyW': keys.w = false; break;
            case 'KeyA': keys.a = false; break;
            case 'KeyS': keys.s = false; break;
            case 'KeyD': keys.d = false; break;
            default: break;
        }
    }

    window.addEventListener('keydown', keyDown);
    window.addEventListener('keyup', keyUp);

    // Чтобы управление работало даже без клика, можно добавить указание, но событий хватает.
    // Для мобильных устройств можно добавить виртуальные кнопки, но это выходит за рамки статьи.

    // --- 5. Адаптация под изменение размера окна ---
    function handleWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', handleWindowResize);

    // --- 6. Анимация и обновление движения ---
    let lastTime = performance.now();

    function animate() {
        const now = performance.now();
        let delta = Math.min(1/30, (now - lastTime) / 1000);
        lastTime = now;

        // Скорость движения и поворота (зависит от дельты времени)
        const moveSpeed = 2.5 * delta;   // метров в секунду
        const rotSpeed = 2.0 * delta;     // радиан в секунду

        // Обработка поворота (A и D)
        if (keys.a && !keys.d) {
            rotate += rotSpeed;
        }
        if (!keys.a && keys.d) {
            rotate -= rotSpeed;
        }

        // Вычисление движения вперёд/назад
        let moveX = 0, moveZ = 0;
        if (keys.w && !keys.s) {
            moveX += Math.sin(rotate);
            moveZ += Math.cos(rotate);
        }
        if (!keys.w && keys.s) {
            moveX -= Math.sin(rotate);
            moveZ -= Math.cos(rotate);
        }

        // Нормализация диагонального движения
        if (moveX !== 0 || moveZ !== 0) {
            const len = Math.hypot(moveX, moveZ);
            moveX /= len;
            moveZ /= len;
        }

        let newX = position.x + moveX * moveSpeed;
        let newZ = position.z + moveZ * moveSpeed;

        // Ограничения движения стенами (границы комнаты)
        // Комната: X от -2.3 до 2.3, Z от -4.8 до 4.8 (с учётом размера камеры)
        const limitX = 2.0;
        const limitZ = 4.5;
        newX = Math.max(-limitX, Math.min(limitX, newX));
        newZ = Math.max(-limitZ, Math.min(limitZ, newZ));

        position.x = newX;
        position.z = newZ;

        velocityY -= GRAVITY * delta;
        playerY += velocityY * delta;
        if (playerY <= GROUND_Y) {
            playerY = GROUND_Y;
            velocityY = 0;
            onGround = true;
        }

        // Обновление позиции камеры
        camera.position.x = position.x;
        camera.position.z = position.z;
        camera.position.y = playerY;

        // Направление взгляда камеры: вперёд от текущей позиции
        const lookAtX = position.x + Math.sin(rotate);
        const lookAtZ = position.z + Math.cos(rotate);
        camera.lookAt(lookAtX, playerY - 0.3, lookAtZ);

        // Небольшая анимация: вращаем декоративные кубы
        const time = Date.now() * 0.002;
        cube1.rotation.y = time;
        cube2.rotation.x = time * 0.7;
        sphere.position.y = -0.1 + Math.sin(time * 3) * 0.05;

        updateBullets(delta);

        // Рендеринг сцены
        renderer.render(scene, camera);

        // Запрос следующего кадра
        requestAnimationFrame(animate);
    }

    // Запуск игрового цикла
    animate();

    // Небольшое улучшение: блокировка контекстного меню для удобства
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    // Вывод сообщения в консоль об успешной загрузке
    console.log('Игра запущена! Управление: WASD, Пробел — прыжок, ЛКМ — выстрел по курсору');
</script>
</body>
</html>
